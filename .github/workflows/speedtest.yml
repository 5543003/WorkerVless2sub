name: Cloudflare SpeedTest

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  speedtest:
    name: Run CloudflareSpeedTest and update CSV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download CloudflareSpeedTest
        run: |
          set -e
          wget -q -O cfst_linux_amd64.tar.gz \
            "https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz"
          tar -xzf cfst_linux_amd64.tar.gz

          if [ -f cfst_linux_amd64/cfst ]; then
            mv cfst_linux_amd64/cfst ./cfst
          elif [ -f cfst ]; then
            true
          elif [ -f CloudflareST ]; then
            mv CloudflareST cfst
          elif [ -f cfst_linux_amd64/CloudflareST ]; then
            mv cfst_linux_amd64/CloudflareST ./cfst
          else
            echo "Binary not found:"
            find . -maxdepth 3 -type f \( -name "cfst*" -o -name "CloudflareST*" \) 2>/dev/null || true
            ls -la cfst_linux_amd64/ 2>/dev/null || true
            exit 1
          fi
          chmod +x cfst

          if [ -f cfst_linux_amd64/ip.txt ]; then
            cp cfst_linux_amd64/ip.txt ./ip.txt
          elif [ -f ip.txt ]; then
            true
          else
            echo "ip.txt missing, download Cloudflare IP ranges"
            curl -s https://www.cloudflare.com/ips-v4 > ip.txt
          fi

          ls -la cfst ip.txt
          ./cfst -v || true

      - name: Run speed test
        timeout-minutes: 15
        run: |
          set -e
          echo "=== start speed test ==="

          # -sl 0：不设速度下限，避免无结果时不生成 result.csv
          # -dn 10：减少下载测速数量，降低超时和空结果概率
          ./cfst \
            -n 200 \
            -t 4 \
            -dn 10 \
            -dt 8 \
            -tl 500 \
            -sl 0 \
            -p 0 \
            -o result.csv \
            -f ip.txt

          if [ ! -f result.csv ]; then
            echo "CloudflareSpeedTest produced no result.csv."
            echo "No IP passed the current test conditions."
            # 保留表头，避免后续步骤再因缺文件失败
            printf 'IP 地址,已发送,已接收,丢包率,平均延迟,下载速度(MB/s),地区码\n' > result.csv
          fi

          LINES=$(wc -l < result.csv)
          echo "result.csv lines: $LINES"
          head -n 15 result.csv

          # 只有表头、没有数据行时，不更新仓库文件
          if [ "$LINES" -le 1 ]; then
            echo "No valid results, skip update"
            exit 0
          fi

          head -n 51 result.csv > CloudflareSpeedTest.csv
          echo "=== CloudflareSpeedTest.csv preview ==="
          head -n 10 CloudflareSpeedTest.csv

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f CloudflareSpeedTest.csv ]; then
            echo "No CSV to commit"
            exit 0
          fi

          if git diff --quiet CloudflareSpeedTest.csv 2>/dev/null; then
            echo "CSV unchanged, skip commit"
            exit 0
          fi

          git add CloudflareSpeedTest.csv
          git commit -m "chore: update CloudflareSpeedTest.csv $(date -u +%Y-%m-%d)"
          git push
